control_center_4991 = "Please fill out all required fields before adding a custom validation type."
control_center_4992 = "Custom validation type successfully added! You may now enable it in the system."
control_center_4993 = "You may add or edit a field validation type that can be utilized by users for fields in their projects. REDCap's field validation is based on regular expressions (regex). So you will need to know how to construct regular expressions (or ask AI for help) in order to add new validation types. For example, if you wanted to add \"12-digit Number\" as a new validation type, the regex would be <code>^\d{12}$</code>, so you would enter <code>\d{12}</code> into the regex pattern text box (since the ^ and $ do not need to be added). Note: The regex will be the same for both PHP and JavaScript most of the time; however, you may use the <code>≠</code> toggle next to the Regex pattern field label to accommodate for different entries when the patterns are different. Please be sure that your regular expression is correct and has been tested before adding it and enabling it on a production system."
control_center_4994 = "Different PHP and JavaScript patterns? Press this button to add a different pattern for JavaScript."
