api_docs_381 = "You may use the literal value \"new\" if you wish to add the file to the next auto-numbered (i.e., not yet created) instance of a repeating instrument or repeating event."
control_center_4982 = "Add Custom Validation Type"
control_center_4983 = "Display names can include letters, numbers, spaces, and special characters. Internal names must be lowercase letters, numbers, or underscores."
control_center_4984 = "All validations have a Data Type that describes what kind of data is being validated. The Data Type will determine if a field can be used with certain special functions. If you are not certain what to use the text option is likely the best choice. The list of options available for a Data Type are determined by Vanderbilt and cannot be changed."
