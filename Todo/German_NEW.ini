api_docs_381 = "Sie können den Literalwert \"new\" verwenden, wenn Sie die Datei der nächsten automatisch nummerierten (d. h. noch nicht erstellten) Instanz eines wiederholten Instruments oder wiederholten Events hinzufügen möchten."
control_center_4982 = "Benutzerdefinierten Validierungstyp hinzufügen"
control_center_4983 = "Anzeigenamen können Buchstaben, Zahlen, Leerzeichen und Sonderzeichen enthalten. Interne Namen dürfen nur Kleinbuchstaben, Zahlen oder Unterstriche enthalten."
control_center_4984 = "Alle Validierungen haben einen \"Datentyp\", der beschreibt, welche Art von Daten validiert wird. Der Datentyp bestimmt, ob ein Feld mit bestimmten speziellen Funktionen verwendet werden kann. Wenn Sie nicht sicher sind, was Sie verwenden sollen, ist die Option \"Text\" wahrscheinlich die beste Wahl. Die für einen Datentyp verfügbaren Optionen werden von Vanderbilt festgelegt und können nicht geändert werden."
