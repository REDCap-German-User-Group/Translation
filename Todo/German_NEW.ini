control_center_4991 = "Bitte füllen Sie alle erforderlichen Felder aus, bevor Sie einen benutzerdefinierten Validierungstyp hinzufügen."
control_center_4992 = "Benutzerdefinierter Validierungstyp erfolgreich hinzugefügt! Sie können ihn nun im System aktivieren."
control_center_4993 = "Sie können einen Feldvalidierungstyp hinzufügen oder bearbeiten, den Benutzer für Felder in ihren Projekten verwenden können. Die Feldvalidierung von REDCap basiert auf regulären Ausdrücken (Regex). Daher müssen Sie wissen, wie reguläre Ausdrücke erstellt werden (oder AI um Hilfe bitten), um neue Validierungstypen hinzuzufügen. Wenn Sie beispielsweise \"12-stellige Zahl\" als neuen Validierungstyp hinzufügen möchten, wäre der reguläre Ausdruck <code>^\d{12}$</code>. Sie würden daher <code>\d{12}</code> in das Textfeld für das Regex-Muster eingeben (da ^ und $ nicht hinzugefügt werden müssen). Hinweis: Meistens ist der reguläre Ausdruck für PHP und JavaScript identisch. Sie können jedoch den Schalter <code>≠</code> neben dem Label des Felds Regex-Muster verwenden, um unterschiedliche Eingaben zu ermöglichen, wenn die Muster voneinander abweichen. Vergewissern Sie sich, dass Ihr regulärer Ausdruck korrekt ist und getestet wurde, bevor Sie ihn hinzufügen und in einem Produktionssystem aktivieren."
control_center_4994 = "Unterschiedliche PHP- und JavaScript-Muster? Klicken Sie auf diesen Button, um ein anderes Muster für JavaScript hinzuzufügen."
