name: Release German translation

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag and language file
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            local title="$1"
            local message="$2"
            printf '::error title=%s::%s\n' "$title" "$message"
            printf '### Release blocked\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            fail "Invalid release tag" "Release tags must match vX.Y.Z; received '$GITHUB_REF_NAME'."
          version="${GITHUB_REF_NAME#v}"
          declared_version="$(sed -nE 's/^; REDCap ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Translation/German.ini | head -n 1)"
          [[ -n "$declared_version" ]] || \
            fail "Missing REDCap version" "Translation/German.ini has no '; REDCap X.Y.Z' version header."
          [[ "$declared_version" == "$version" ]] || \
            fail "Release version mismatch" "Tag $GITHUB_REF_NAME requests REDCap $version, but Translation/German.ini declares REDCap $declared_version. Create a tag that matches the committed language file."
          [[ -s README.md ]] || fail "Missing release file" "README.md is missing or empty."
          [[ -s Translation/German.ini ]] || fail "Missing release file" "Translation/German.ini is missing or empty."
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create release with two assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp README.md release-assets/README.md
          cp Translation/German.ini release-assets/German.ini
          gh release create "$GITHUB_REF_NAME" release-assets/README.md release-assets/German.ini \
            --verify-tag \
            --title "German $VERSION" \
            --notes "German translation for REDCap $VERSION"
